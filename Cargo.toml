[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Patched third-party crates (vendor/README.md): not ours, so not formatted, linted or layered as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jonasbove/pingcraft"
publish = false

# The Craft apps' house lints (ADR 0009).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
pingcraft-core = { path = "crates/core" }
pingcraft-ui-egui = { path = "crates/ui-egui" }
# Pinned exactly: SDK upgrades are their own pull request, contained in pingcraft-matrix (ADR 0009).
matrix-sdk = { version = "=0.19.1", default-features = false }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
serde_json = "1"
# craft-libs, pinned at one revision (bump deliberately), on the same egui fork commit as below.
craft-settings = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }
craft-ui = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }
craft-host = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }
craft-behavior = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }
craft-theme = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }
craft-window = { version = "=0.1.0", git = "https://github.com/storytold/craft-libs", rev = "a6103343f9bb89703f933342563f47a783529eb6" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"

# The egui family and winit on the same reviewed storytold fork commits as the Craft apps and craft-libs,
# so craft-libs crates link against the same egui.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
emath = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "b9770908e0f304896f9658d239a7b29cf8af1564" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# ruma with explicit types on four `deserialize` calls, so it compiles next to craft-i18n (E0275 once `zerovec/serde`
# is on). Unmodified crates.io releases otherwise; removed once ruma releases the fix (vendor/README.md).
ruma-common = { path = "vendor/ruma-common-0.20.2" }
ruma-events = { path = "vendor/ruma-events-0.35.2" }

[package]
name = "pingcraft-ui-egui"
description = "PingCraft's interface in egui. Depends on pingcraft-core only, never on Matrix SDK types."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pingcraft-core = { workspace = true }
egui = { workspace = true }
# craft-libs' UI library (craft-libs docs/craft-framework.md): the interface's font stack, the runtime and its
# components, and the services the runtime reads (the host, the window system).
craft-ui = { workspace = true, features = ["color_fonts"] }
craft-host = { workspace = true }
craft-behavior = { workspace = true }
craft-window = { workspace = true }
log = "0.4"
# Times in the inbox and the chat (house rule 5).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Decoding the logo PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1.9"
# QR codes a bridge shows when linking a network's app (MIT OR Apache-2.0). Drawn with egui, so no image features.
qrcode = { version = "0.15", default-features = false, features = ["std"] }
# Grapheme clusters, to tell emoji from text (MIT OR Apache-2.0).
unicode-segmentation = "1.13"
# Emoji names, shortcodes and groups for the picker and `:name:` ((MIT OR Apache-2.0) AND Unicode-3.0).
emojis = "0.9"

# Colour emoji glyphs (COLR, CBDT, sbix) through vello_cpu, on the desktop and the web.
epaint = { version = "0.37", features = ["color_fonts"] }

[build-dependencies]
# Checks the colour emoji font against its pinned hash (build.rs).
sha2 = "0.10"

# The browser's clock and time zone on the web.
# Installed fonts for characters the interface's faces lack (other scripts in names and messages); desktop only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ui = { workspace = true, features = ["color_fonts", "system_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
# Fetching the colour emoji font after the page opens (all MIT OR Apache-2.0, already used by eframe's web build).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }
# Checks the colour emoji font that arrives after start against its pinned hash.
sha2 = "0.10"

[dev-dependencies]
# The tests install a colour font after start, as the web build does.
sha2 = "0.10"
# egui 0.37 no longer bundles its fallback faces by default; the tests install them.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { version = "0.37" }
